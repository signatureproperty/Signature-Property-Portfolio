# ==============================================================================
# SIGNATURE PROPERTY & CONSULTANT — NGINX SECURITY & COMPRESSION CONFIG
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name signatureproperty.pk portfolio.signatureproperty.pk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signatureproperty.pk portfolio.signatureproperty.pk;

    root /var/www/signature-property;
    index index.html;

    # SSL Certificates (Configure with Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/signatureproperty.pk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/signatureproperty.pk/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; frame-ancestors 'self'; form-action 'self' https://wa.me;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny access to hidden/git/env files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
